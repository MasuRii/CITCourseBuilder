# GitHub Pages deployment DISABLED in favor of Cloudflare Pages (citcoursebuilder.masurii.dev)
# To re-enable: replace the workflow_dispatch trigger below and restore the full workflow
# Original workflow: renamed from deploy.yml to deploy.yml.disabled conceptually
name: Deploy Astro App to GitHub Pages [DISABLED]

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm re-enabling GitHub Pages deployment'
        required: true
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: 'pages-disabled'
  cancel-in-progress: true

jobs:
  noop:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'YES'
    steps:
      - name: GitHub Pages deployment is disabled
        run: |
          echo "GitHub Pages deployment has been disabled."
          echo "The project is now deployed via Cloudflare Pages at https://citcoursebuilder.masurii.dev"
          echo "To re-enable GitHub Pages, restore the original deploy.yml workflow."
